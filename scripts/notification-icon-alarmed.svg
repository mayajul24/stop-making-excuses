<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <rect x="0" y="0" width="144" height="144" rx="28" fill="#c62828"/>
  <g transform="translate(12, 6)">
    <defs>
      <clipPath id="head-clip">
        <circle cx="60" cy="50" r="33" />
      </clipPath>
    </defs>

    <!-- hair volume, behind everything -->
    <g>
      <circle cx="60" cy="19" r="29" fill="#2e2019"/>
      <circle cx="29" cy="27" r="21" fill="#2e2019"/>
      <circle cx="91" cy="27" r="21" fill="#2e2019"/>
      <circle cx="16" cy="48" r="19" fill="#2e2019"/>
      <circle cx="104" cy="48" r="19" fill="#2e2019"/>
      <circle cx="14" cy="76" r="17" fill="#2e2019"/>
      <circle cx="106" cy="76" r="17" fill="#2e2019"/>
      <circle cx="19" cy="104" r="15" fill="#2e2019"/>
      <circle cx="101" cy="104" r="15" fill="#2e2019"/>
      <circle cx="27" cy="128" r="13" fill="#2e2019"/>
      <circle cx="93" cy="128" r="13" fill="#2e2019"/>
      <circle cx="24" cy="40" r="8" fill="#4a3327"/>
      <circle cx="98" cy="42" r="7" fill="#4a3327"/>
      <circle cx="20" cy="90" r="7" fill="#4a3327"/>
      <circle cx="102" cy="92" r="6.5" fill="#4a3327"/>
    </g>

    <!-- shoulders + top -->
    <path d="M28 118 Q60 100 92 118 L96 144 L24 144 Z" fill="#8fa8ae"/>

    <!-- neck -->
    <rect x="52" y="82" width="16" height="18" fill="#d9a679"/>

    <!-- head -->
    <circle cx="60" cy="50" r="33" fill="#e8b98f"/>

    <!-- front curls, clipped to the head -->
    <g clip-path="url(#head-clip)">
      <circle cx="34" cy="27" r="11" fill="#2e2019"/>
      <circle cx="48" cy="21" r="11.5" fill="#2e2019"/>
      <circle cx="60" cy="19" r="12" fill="#2e2019"/>
      <circle cx="72" cy="21" r="11.5" fill="#2e2019"/>
      <circle cx="86" cy="27" r="11" fill="#2e2019"/>
      <circle cx="26" cy="38" r="10" fill="#2e2019"/>
      <circle cx="94" cy="38" r="10" fill="#2e2019"/>
    </g>

    <!-- ears + gold hoops -->
    <circle cx="27" cy="54" r="5" fill="#e8b98f"/>
    <circle cx="93" cy="54" r="5" fill="#e8b98f"/>
    <circle cx="27" cy="60" r="2.6" fill="none" stroke="#ffc800" stroke-width="1.6"/>
    <circle cx="93" cy="60" r="2.6" fill="none" stroke="#ffc800" stroke-width="1.6"/>

    <!-- eyebrows: raised high, alarmed -->
    <path d="M39 36 Q47.5 27 56 34" stroke="#2e2019" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="M64 34 Q72.5 27 81 36" stroke="#2e2019" stroke-width="3.6" fill="none" stroke-linecap="round"/>

    <!-- eyes: wide, shocked -->
    <circle cx="47.5" cy="49" r="8.6" fill="#fff"/>
    <circle cx="72.5" cy="49" r="8.6" fill="#fff"/>
    <circle cx="47.5" cy="49" r="5" fill="#2b2019"/>
    <circle cx="72.5" cy="49" r="5" fill="#2b2019"/>
    <circle cx="49.6" cy="46.4" r="1.8" fill="#fff"/>
    <circle cx="74.6" cy="46.4" r="1.8" fill="#fff"/>

    <!-- nose -->
    <path d="M59 52 L57.5 60 Q60 61.5 62.5 60" stroke="#d9a679" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- mouth: small gasp -->
    <ellipse cx="60" cy="70" rx="6.5" ry="8" fill="#2b2019"/>
    <ellipse cx="60" cy="72" rx="4" ry="4.5" fill="#8a4a4a"/>
  </g>
</svg>
